<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Z¹ Platform · Test chat</title>
<style>
  :root{
    --ink:#14202b; --muted:#5b6b78; --line:#dbe3ea; --bg:#f5f7f9; --card:#fff;
    --accent:#1d4ed8; --accent-ink:#fff; --user:#eef3fb; --warn:#9a3412;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  body.locked > *:not(#gate){display:none!important}
  #gate{display:none}
  body.locked #gate{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .gate-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px;width:100%;max-width:360px}
  .gate-card h1{font-size:18px;margin:0 0 4px}
  .gate-card p{color:var(--muted);margin:0 0 16px;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button:disabled{opacity:.55;cursor:default}
  .err{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}

  .app{display:flex;flex-direction:column;height:100vh;max-width:860px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
  header .title{font-weight:700}
  header .sub{color:var(--muted);font-size:13px}
  header .actions{display:flex;gap:8px}
  .banner{font-size:12.5px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);background:#fbfcfd}
  #log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .empty{color:var(--muted);text-align:center;margin:auto 0;font-size:14px}
  .msg{max-width:88%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
  .msg.user{align-self:flex-end;background:var(--user);border-color:#d6e1f3;white-space:pre-wrap}
  .msg.bot{align-self:flex-start}
  .msg.error{border-color:#f3c9b5;background:#fff7f3;color:var(--warn)}
  .msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}
  .msg ul,.msg ol{margin:4px 0 8px;padding-left:20px}
  .msg code{background:#f0f3f6;padding:1px 4px;border-radius:4px;font-size:13px}
  sup.cite{color:var(--accent);font-weight:600;font-size:11px;margin-left:1px}
  .sources{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .sources div{margin:2px 0}
  .sources b{color:var(--ink);font-weight:600}
  .meta{margin-top:6px;font-size:11.5px;color:#8a97a3}
  .status{align-self:flex-start;color:var(--muted);font-size:13px}
  form#ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
  form#ask textarea{flex:1;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;min-height:44px;max-height:160px}
  @media (max-width:600px){ .msg{max-width:100%} header .sub{display:none} }
</style>
</head>
<body class="locked">

<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <h1>Z¹ Platform test chat</h1>
    <p>Internal test tool. Enter the tenant's ask key.</p>
    <label for="keyInput">Ask key</label>
    <input id="keyInput" type="password" required>
    <div class="err" id="gateErr"></div>
    <button class="primary" type="submit" style="width:100%;margin-top:6px">Open chat</button>
  </form>
</div>

<div class="app">
  <header>
    <div>
      <div class="title">Z¹ Platform test chat</div>
      <div class="sub" id="tenantLine">Answers come only from the tenant's loaded documents.</div>
    </div>
    <div class="actions">
      <button type="button" id="newChat">New chat</button>
      <button type="button" id="signOut">Sign out</button>
    </div>
  </header>
  <div class="banner">Internal test by Zero1 Ventures. Not a client product. Conversations are logged for review.</div>
  <div id="log"><div class="empty" id="empty">Ask a question to start.</div></div>
  <form id="ask">
    <textarea id="q" rows="1" placeholder="Ask a question" maxlength="2000"></textarea>
    <button class="primary" type="submit" id="send">Send</button>
  </form>
</div>

<script>
(function () {
  var ENDPOINT = "https://qnrhpgxndmktegittmii.supabase.co/functions/v1/ask";
  var KEY_STORE = "z1chat_key";
  var key = "";
  var conversationId = null;
  var busy = false;

  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), q = $("q"), send = $("send");

  function store(k) { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} }
  function load() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }

  function lock(msg) {
    key = ""; store("");
    document.body.classList.add("locked");
    $("gateErr").textContent = msg || "";
    $("keyInput").value = ""; $("keyInput").focus();
  }
  function unlock(k) {
    key = k; store(k);
    document.body.classList.remove("locked");
    q.focus();
  }

  $("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var k = $("keyInput").value.trim();
    if (k) unlock(k);
  });
  $("signOut").addEventListener("click", function () { resetChat(); lock(""); });
  $("newChat").addEventListener("click", resetChat);

  function resetChat() {
    conversationId = null;
    log.innerHTML = '<div class="empty" id="empty">Ask a question to start.</div>';
    q.focus();
  }

  // --- tiny, safe markdown: escape first, then bold, inline code, lists, paragraphs, [n] citations
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function inline(s) {
    return s.replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/\[(\d+)\]/g, '<sup class="cite">[$1]</sup>');
  }
  function render(md) {
    var lines = esc(md).split("\n"), out = [], list = null, para = [];
    function flushPara() { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } }
    function flushList() { if (list) { out.push("<" + list.type + ">" + list.items.map(function (i) { return "<li>" + inline(i) + "</li>"; }).join("") + "</" + list.type + ">"); list = null; } }
    lines.forEach(function (line) {
      var ul = /^\s*[-*]\s+(.*)$/.exec(line), ol = /^\s*\d+\.\s+(.*)$/.exec(line);
      if (ul || ol) {
        flushPara();
        var type = ul ? "ul" : "ol";
        if (!list || list.type !== type) { flushList(); list = { type: type, items: [] }; }
        list.items.push((ul || ol)[1]);
      } else if (!line.trim()) { flushPara(); flushList(); }
      else { flushList(); para.push(line); }
    });
    flushPara(); flushList();
    return out.join("");
  }

  function add(cls, html) {
    var e = $("empty"); if (e) e.remove();
    var d = document.createElement("div");
    d.className = cls; d.innerHTML = html;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }

  function sourcesHtml(cites) {
    if (!cites || !cites.length) return "";
    return '<div class="sources">' + cites.map(function (c) {
      var where = c.heading_path ? " · " + esc(c.heading_path) : "";
      return "<div>[" + c.n + "] <b>" + esc(c.title || "Source") + "</b>" + where + "</div>";
    }).join("") + "</div>";
  }

  async function ask(text) {
    busy = true; send.disabled = true;
    add("msg user", esc(text));
    var status = add("status", "Looking that up…");
    var started = Date.now();
    try {
      var res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-api-key": key },
        body: JSON.stringify(conversationId ? { question: text, conversation_id: conversationId, channel: "web" }
          : { question: text, channel: "web", consent: true, consent_text: "Internal test by Zero1 Ventures. Conversations are logged for review." })
      });
      var data = await res.json().catch(function () { return {}; });
      status.remove();
      if (res.status === 401) { lock("That key wasn't accepted."); return; }
      if (res.status === 429) { add("msg error", "Too many questions in a short time. Wait a minute and try again."); return; }
      if (!res.ok) { add("msg error", esc("Something went wrong" + (data.detail ? ": " + data.detail : "."))); return; }
      conversationId = data.conversation_id || conversationId;
      if (data.tenant && data.tenant.name) $("tenantLine").textContent = "Tenant: " + data.tenant.name + " · answers come only from its loaded documents.";
      var meta = ((data.ms || (Date.now() - started)) / 1000).toFixed(1) + "s · " + (data.found_sources || 0) + " sources searched" +
                 (data.tokens ? " · " + data.tokens.in + " in / " + data.tokens.out + " out tokens" : "");
      add("msg bot", render(data.answer || "") + sourcesHtml(data.citations) + '<div class="meta">' + esc(meta) + "</div>");
    } catch (err) {
      status.remove();
      add("msg error", "Couldn't reach the server. Check your connection and try again.");
    } finally {
      busy = false; send.disabled = false; q.focus();
    }
  }

  $("ask").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = q.value.trim();
    if (!text || busy) return;
    q.value = ""; q.style.height = "";
    ask(text);
  });
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); }
  });
  q.addEventListener("input", function () { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; });

  var saved = load();
  if (saved) unlock(saved); else $("keyInput").focus();
})();
</script>
</body>
</html>
